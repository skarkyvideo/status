# Upptime för Skarky Media: kollar tjänsterna utifrån var 5:e minut.
# Går något ner öppnas ett ärende (issue) här, Elias får mejl från GitHub
# och hubblarm.yml skickar en push-avisering via hubben.
owner: skarkyvideo
repo: status

sites:
  # /tjanst/ släpps förbi Cloudflare Access, så den här kollen når hubbens Pages på riktigt.
  # (Startsidan ger alltid 302 till Access-inloggningen, även om Pages skulle vara nere.)
  - name: Jarvis-hubben
    url: https://jarvis-hub.pages.dev/tjanst/
    maxResponseTime: 10000
  # n8n via Cloudflare-tunneln till n8n-datorn
  - name: n8n
    url: https://n8n.skarkymedia.se/healthz
    maxResponseTime: 10000
  - name: skarkymedia.se
    url: https://skarkymedia.se
    maxResponseTime: 10000

assignees:
  - skarkyvideo

# Inga hemligheter används i kollarna.
secrets: []

status-website:
  baseUrl: /status
  name: Skarky Media status
  introTitle: "**Skarky Media** – driftstatus"
  introMessage: Kollas automatiskt var 5:e minut.
  navbar:
    - title: Status
      href: /
